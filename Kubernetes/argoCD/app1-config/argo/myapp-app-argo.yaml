apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: amy-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Hastag-Deepak-Poudel/app1-config.git
    targetRevision: HEAD
    path: app1-helm
    helm:
      releaseName: app1
  destination:
    server: https://kubernetes.default.svc
    namespace: my-app-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
{{- range .Values.users }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .name }}-role-binding
  namespace: default
subjects:
  - kind: User
    name: {{ .name }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role 
  name: {{ .role }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
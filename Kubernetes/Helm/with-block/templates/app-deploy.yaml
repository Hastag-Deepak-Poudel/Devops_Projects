{{- with .Values.deployment }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    app: {{ .name }}
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
    spec:
      containers:
      - name: {{ $.Values.container.name }}
        {{- with .image }}
        image: {{ .repository }}:{{ .tag }}
        {{- end }}
        ports:
        {{- with .ports }}
        - containerPort: {{- .port1 }}
        - containerPort: {{- .port2 }}
        {{- end }}
{{- end }}
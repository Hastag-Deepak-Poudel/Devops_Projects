apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast-ssd # This is the name of the storageclass which will be used in pvc for binding
provisioner: kubernetes.io/aws-ebs #here ebs of aws is used for storage which is created by aws administrator
parameters:
  type: gp3
reclaimPolicy: Delete # When pvc gets deleted, the storage inside the aws which was binded is also deleted
allowVolumeExpansion: true # make the volume expandable incase more storage is required.
volumeBindingMode: WaitForFirstConsumer # wait for the pod to be connected to the pvc first before binding immediately

# This is the type of storage where data is stored in the node(server). If somehow a node gets deleted or restarted, the 
# data inside volume /data will also be deleted. Also the data are not shared between nodes if there is multinode cluster.
# When you delete a pod, the data will not be deleted.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-deployment
  labels:
    app: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
      - name: mongo
        image: mongo:4.4
        args: ["--dbpath", "/data/db"]
        env:
          - name: MONGO_INITDB_ROOT_USERNAME
            value: "admin"
          - name: MONGO_INITDB_ROOT_PASSWORD
            value: "password"
        volumeMounts:
          - mountPath: /data/db
            name: mongo-volume # add the name from the Volumes: name:_______
      volumes:
        - name: mongo-volume # first creates volume than do volumeMounts
          hostPath:
            path: /data # This data is inside the minikube node.

---
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
spec:
  type: NodePort
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
      nodePort: 32000
